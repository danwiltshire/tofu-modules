name: Pull Request Checks

on:
  pull_request:
    branches:
      - main

permissions: {}

jobs:
  scan:
    permissions:
      contents: read
      
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Checkov GitHub Action
        uses: bridgecrewio/checkov-action@v12
        with:
          framework: terraform
          output_format: cli
          output_file_path: console