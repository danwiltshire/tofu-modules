metadata:
  name: "Ensure resource names follow the organisational naming convention"
  id: "CKV_AWS_NAMING_CONVENTION"
  category: "CONVENTION"
  guideline: "https://github.com/danwiltshire/tofu-modules/blob/main/conventions/RESOURCE_NAMING.md"
  severity: "HIGH"

definition:
  or:
    - cond_type: "attribute"
      resource_types:
        - "aws_db_instance"
      attribute: "identifier"
      operator: "regex_match"
      # application-environment-component-instance-1
      value: "^[A-Za-z0-9-]+$"

    - cond_type: "attribute"
      resource_types:
        - "aws_cloudwatch_log_group"
      attribute: "name"
      operator: "regex_match"
      # /application/environment/component/resource-purpose
      value: "^[A-Za-z0-9-/]+$"

    - cond_type: "attribute"
      resource_types:
        - "aws_vpc"
      attribute: "tags.Name"
      operator: "equals"
      value: "${var.context.application}-${var.context.environment}-${data.aws_region.current.region}"
